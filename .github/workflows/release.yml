name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional tag name to associate (no-op if not pushed). Leave empty for dry-run.'
        required: false
        default: ''

permissions:
  contents: write

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  package:
    name: Package (ubuntu-latest)
    runs-on: ubuntu-latest
    outputs:
      zip_name: ${{ steps.locate.outputs.zip_name }}
      zip_sha256: ${{ steps.locate.outputs.zip_sha256 }}
      zip_size_mb: ${{ steps.locate.outputs.zip_size_mb }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-quality: preview

      - name: dotnet --info
        run: dotnet --info

      - name: Determine version
        id: meta
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Run packager
        env:
          PACKAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: dotnet run --project src/PlaywrightOfflinePackager -c Release

      - name: Locate ZIP and compute SHA256
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(ls -t output/PlaywrightOffline-*.zip | head -1)
          if [[ -z "$ZIP" ]]; then
            echo "::error::No ZIP produced under output/"
            exit 1
          fi
          NAME=$(basename "$ZIP")
          SHA=$(sha256sum "$ZIP" | awk '{print $1}')
          SIZE_MB=$(awk "BEGIN{printf \"%.2f\", $(stat -c%s "$ZIP") / 1048576}")
          echo "zip_path=$ZIP"        >> "$GITHUB_OUTPUT"
          echo "zip_name=$NAME"       >> "$GITHUB_OUTPUT"
          echo "zip_sha256=$SHA"      >> "$GITHUB_OUTPUT"
          echo "zip_size_mb=$SIZE_MB" >> "$GITHUB_OUTPUT"
          echo "ZIP : $ZIP ($SIZE_MB MB)"
          echo "SHA : $SHA"

      - name: Verify ZIP contents
        shell: bash
        run: |
          set -euo pipefail
          ZIP="${{ steps.locate.outputs.zip_path }}"
          for needle in \
              "setup.ps1" \
              "setup-devpack.ps1" \
              "uninstall.ps1" \
              "uninstall-devpack.ps1" \
              "new-playwright-project.ps1" \
              "NuGet.config.template" \
              "README.txt" \
              "BUILD-INFO.txt" \
              "VERSION.txt" \
              "samples/hello-nunit/hello-nunit.csproj" \
              "samples/hello-mstest/hello-mstest.csproj" \
              "samples/hello-console/hello-console.csproj" \
              "samples/hello-nunit/NuGet.config" \
              "samples/hello-console/Program.cs" \
              "nuget/INDEX.txt" \
              "nuget/microsoft.playwright.1.60.0.nupkg" \
              "nuget/microsoft.playwright.nunit.1.60.0.nupkg" \
              "nuget/microsoft.playwright.mstest.1.60.0.nupkg" \
              "nuget/coverlet.collector.6.0.2.nupkg" \
              "nuget/nunit.analyzers.4.4.0.nupkg" \
              "nuget/mstest.analyzers.3.6.4.nupkg"; do
            if unzip -l "$ZIP" | grep -qE "[[:space:]]${needle//./\\.}\$"; then
              echo "  ✓ $needle"
            else
              echo "::error::Required entry missing from ZIP: $needle"
              exit 1
            fi
          done

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          ZIP_NAME="${{ steps.locate.outputs.zip_name }}"
          SHA="${{ steps.locate.outputs.zip_sha256 }}"
          SIZE_MB="${{ steps.locate.outputs.zip_size_mb }}"

          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${VERSION}\$" | head -1 || true)
          {
            echo "## Summary"
            echo ""
            echo "- **Version**: \`${VERSION}\`"
            echo "- **Built**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "- **Source commit**: ${GITHUB_SHA}"
            echo ""
            echo "### Asset"
            echo ""
            echo "| Asset | Size | SHA256 |"
            echo "|---|---|---|"
            echo "| \`${ZIP_NAME}\` | ${SIZE_MB} MB | \`${SHA}\` |"
            echo ""
            echo "Single combined ZIP containing:"
            echo "- **Dev pack** (\`nuget/\`) — offline NuGet feed with Microsoft.Playwright + NUnit + MSTest packages + coverlet/analyzers"
            echo "- **Sample projects** (\`samples/hello-nunit\`, \`hello-mstest\`, \`hello-console\`) — reference source code for offline Playwright projects"
            echo "- Double-click \`點擊兩下-完整安裝(推薦).cmd\` to install the dev pack."
            echo "  Then copy one of \`samples/\` to your working directory and run \`dotnet test --settings .runsettings\` (or \`dotnet run\`)."
            echo ""
            echo "**Breaking change vs v0.5.x**: ZIP no longer contains a precompiled \`PlaywrightSampleApp.exe\`. Sample projects replace it as the reference. \`install.ps1\` / \`uninstall-runtime.ps1\` / the \`點擊兩下-僅安裝Runtime.cmd\` launcher are removed."
            echo ""
            echo "## Self-test results"
            echo ""
            echo "This release is built only after the \`verify-offline\` job has:"
            echo "- Installed the dev pack on a clean Windows Server 2022 runner"
            echo "- Blocked **all** outbound network traffic via Windows Defender Firewall"
            echo "- Successfully run \`dotnet build\` against \`samples/hello-console\` 100% offline (proving the bundled NuGet feed resolves everything without internet)"
            echo "- Audited TCP connections and confirmed **no external network activity**"
            echo ""
            echo "## Changes"
            echo ""
            if [[ -n "$PREV_TAG" ]]; then
              echo "Changes since \`${PREV_TAG}\`:"
              echo ""
              echo "### Commits"
              echo ""
              git log --pretty=format:'- %h %s (%an)' "${PREV_TAG}..HEAD" || true
              echo ""
              echo ""
              echo "### Files"
              echo ""
              echo '```'
              git diff --stat "${PREV_TAG}..HEAD" || true
              echo '```'
            else
              echo "Initial release. Full commit history:"
              echo ""
              git log --pretty=format:'- %h %s (%an)' || true
              echo ""
            fi
          } > release-notes.md

          echo "----- release-notes.md -----"
          cat release-notes.md
          echo "----------------------------"

      - name: Upload ZIP + release notes artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-package
          path: |
            output/PlaywrightOffline-*.zip
            release-notes.md
          if-no-files-found: error
          retention-days: 14

  verify-offline:
    name: Verify Offline Install (windows-2022)
    runs-on: windows-2022
    needs: package
    steps:
      - name: Checkout (for global.json)
        uses: actions/checkout@v4

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-quality: preview

      - name: dotnet --info (pre-warm SDK)
        shell: pwsh
        run: |
          dotnet --info
          # Pre-warm NuGet to ensure SDK is fully extracted before firewall block.
          dotnet new --list | Out-Null

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: offline-package
          path: artifact

      - name: List artifact
        shell: pwsh
        run: Get-ChildItem -Recurse artifact | Format-Table FullName, Length

      - name: Extract ZIP
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path artifact -Recurse -Filter 'PlaywrightOffline-*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'ZIP not found in artifact.' }
          Write-Host "Extracting $($zip.FullName)..."
          Expand-Archive -Path $zip.FullName -DestinationPath extracted -Force
          Get-ChildItem extracted | Format-Table Name, Length

      - name: Baseline — confirm runner currently has internet
        shell: pwsh
        run: |
          $ok = Test-NetConnection -ComputerName www.microsoft.com -Port 443 -InformationLevel Quiet -WarningAction SilentlyContinue
          if (-not $ok) {
            throw 'Baseline failed: runner has no internet, so an offline test would falsely "pass". Aborting.'
          }
          Write-Host '✓ Baseline: internet reachable before firewall block.'

      - name: Block all outbound traffic (Windows Defender Firewall)
        shell: pwsh
        run: |
          Set-NetFirewallProfile -Profile Domain,Public,Private -DefaultOutboundAction Block -DefaultInboundAction Block -Enabled True
          # Allow loopback so local processes can still talk to themselves.
          New-NetFirewallRule -DisplayName 'CI-Allow-Loopback-Out' -Direction Outbound -Action Allow -RemoteAddress 127.0.0.0/8 -Profile Any | Out-Null
          New-NetFirewallRule -DisplayName 'CI-Allow-Loopback-In'  -Direction Inbound  -Action Allow -RemoteAddress 127.0.0.0/8 -Profile Any | Out-Null
          Write-Host '✓ Outbound traffic blocked.'

      - name: Verify firewall block is effective
        shell: pwsh
        run: |
          $reachable = Test-NetConnection -ComputerName www.microsoft.com -Port 443 -InformationLevel Quiet -WarningAction SilentlyContinue
          if ($reachable) {
            throw 'Firewall block did not take effect — www.microsoft.com is still reachable. Cannot proceed with offline test.'
          }
          Write-Host '✓ Confirmed offline: external host unreachable.'

      - name: Run setup.ps1 (installs dev pack)
        shell: pwsh
        working-directory: extracted
        run: |
          Write-Host 'Running setup.ps1 (runner is already admin)...'
          ./setup.ps1
          $feed = Join-Path $Env:USERPROFILE '.nuget\packages'
          $playwrightPackage = Join-Path $feed 'microsoft.playwright.1.60.0.nupkg'
          if (-not (Test-Path $playwrightPackage)) {
            throw "setup.ps1 ran but Microsoft.Playwright.1.60.0.nupkg is missing from $feed"
          }
          Write-Host '✓ Dev pack installation completed.'

      - name: Verify environment variables set
        shell: pwsh
        run: |
          $skip = [Environment]::GetEnvironmentVariable('PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD', 'Machine')
          $bp   = [Environment]::GetEnvironmentVariable('PLAYWRIGHT_BROWSERS_PATH', 'Machine')
          if ($skip -ne '1' -or $bp -ne '0') {
            throw "Env vars not set as expected: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD='$skip' PLAYWRIGHT_BROWSERS_PATH='$bp'"
          }
          Write-Host '✓ Machine env vars set.'

      - name: Snapshot TCP connections before run
        shell: pwsh
        run: |
          $before = Get-NetTCPConnection | Select-Object LocalAddress,LocalPort,RemoteAddress,RemotePort,State,OwningProcess
          $before | ConvertTo-Json -Depth 3 | Out-File -FilePath tcp-before.json -Encoding utf8
          Write-Host "Captured $($before.Count) TCP connections before run."

      - name: Build sample project (proves offline NuGet restore works)
        shell: pwsh
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          PLAYWRIGHT_BROWSERS_PATH: '0'
        run: |
          # Copy sample out of the extracted ZIP so we can build without
          # touching the original tree.
          $src = Join-Path (Resolve-Path 'extracted') 'samples\hello-console'
          if (-not (Test-Path $src)) { throw "Sample not found at $src" }
          $dst = Join-Path (Get-Location) 'work-sample\hello-console'
          New-Item -ItemType Directory -Path $dst -Force | Out-Null
          Copy-Item -Path (Join-Path $src '*') -Destination $dst -Recurse -Force

          Push-Location $dst
          try {
            Write-Host '--- NuGet.config (proves clear + offline feed) ---'
            Get-Content NuGet.config
            Write-Host '----------------------------------------------------'

            Write-Host 'Running: dotnet restore (offline)'
            & dotnet restore --verbosity minimal
            if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed with code $LASTEXITCODE — offline NuGet feed didn't satisfy the graph." }

            Write-Host 'Running: dotnet build -c Release --no-restore'
            & dotnet build -c Release --no-restore --verbosity minimal
            if ($LASTEXITCODE -ne 0) { throw "dotnet build failed with code $LASTEXITCODE while offline." }
          }
          finally { Pop-Location }

          Write-Host '✓ Sample project restored + built 100% offline.'

      - name: Audit TCP connections after run (detect any external traffic from our app)
        shell: pwsh
        run: |
          $beforeRaw = Get-Content tcp-before.json -Raw
          $before = $beforeRaw | ConvertFrom-Json
          # Build a set of pre-existing connection tuples to filter out runner-agent connections
          $beforeKeys = @{}
          foreach ($c in $before) {
            $key = "$($c.LocalAddress)|$($c.LocalPort)|$($c.RemoteAddress)|$($c.RemotePort)"
            $beforeKeys[$key] = $true
          }

          $after = Get-NetTCPConnection | Select-Object LocalAddress,LocalPort,RemoteAddress,RemotePort,State,OwningProcess
          $after | ConvertTo-Json -Depth 3 | Out-File -FilePath tcp-after.json -Encoding utf8

          # New external connections = Established + not loopback/link-local + not in baseline snapshot
          $newExternal = $after | Where-Object {
            $_.State -eq 'Established' -and
            $_.RemoteAddress -and
            $_.RemoteAddress -notmatch '^127\.' -and
            $_.RemoteAddress -ne '::1' -and
            $_.RemoteAddress -notmatch '^169\.254\.' -and
            $_.RemoteAddress -notmatch '^fe80::' -and
            $_.RemoteAddress -ne '0.0.0.0' -and
            $_.RemoteAddress -ne '::' -and
            (-not $beforeKeys.ContainsKey("$($_.LocalAddress)|$($_.LocalPort)|$($_.RemoteAddress)|$($_.RemotePort)"))
          }

          Write-Host ("Baseline external connections (excluded): {0}" -f ($before.Count))
          Write-Host ("Post-run external connections (total)  : {0}" -f ($after.Count))
          Write-Host ("New external connections during run    : {0}" -f (@($newExternal).Count))

          if ($newExternal -and @($newExternal).Count -gt 0) {
            Write-Host 'New external connections opened during the offline test:'
            $newExternal | Format-Table -AutoSize
            $newExternal | ConvertTo-Json -Depth 3 | Out-File -FilePath tcp-violations.json -Encoding utf8
            throw "Offline contract VIOLATED: $((@($newExternal)).Count) NEW external TCP connection(s) opened during the test."
          }
          Write-Host '✓ No new external TCP connections were opened during the offline test.'

      - name: Cleanup — restore firewall (must run before artifact upload)
        if: always()
        shell: pwsh
        run: |
          try {
            Set-NetFirewallProfile -Profile Domain,Public,Private -DefaultOutboundAction Allow -DefaultInboundAction Block
            Get-NetFirewallRule -DisplayName 'CI-Allow-Loopback-Out' -ErrorAction SilentlyContinue | Remove-NetFirewallRule
            Get-NetFirewallRule -DisplayName 'CI-Allow-Loopback-In'  -ErrorAction SilentlyContinue | Remove-NetFirewallRule
            Write-Host '✓ Firewall restored.'
          } catch {
            Write-Warning "Cleanup error: $_"
          }

      - name: Upload network audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-audit
          path: |
            tcp-before.json
            tcp-after.json
            tcp-violations.json
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [package, verify-offline]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: offline-package
          path: artifact

      - name: List downloaded files
        run: ls -la artifact && find artifact -type f

      - name: Move ZIP to flat path
        run: |
          set -euo pipefail
          ZIP=$(find artifact -type f -name 'PlaywrightOffline-*.zip' | head -1)
          NOTES=$(find artifact -type f -name 'release-notes.md' | head -1)
          if [[ -z "$ZIP" ]]; then echo "::error::ZIP not found in artifact"; exit 1; fi
          if [[ -z "$NOTES" ]]; then echo "::error::release-notes.md not found in artifact"; exit 1; fi
          mkdir -p release-assets
          cp "$ZIP"   release-assets/
          cp "$NOTES" release-assets/
          ls -la release-assets/

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body_path: release-assets/release-notes.md
          files: |
            release-assets/PlaywrightOffline-*.zip
